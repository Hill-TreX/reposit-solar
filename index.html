                      '<div class="__we-pk-main-head"><div style="display:flex;align-items:center;gap:10px;"><button type="button" class="__we-pk-back" data-back style="display:none;background:transparent;border:none;color:#a3a3a3;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:12px;">← Back</button><span class="__we-pk-main-title" data-main-title>Pick a section type</span></div><button type="button" class="__we-pk-close">CLOSE</button></div>' +
                      '<div data-pane="library-grid" class="__we-pk-grid"><div class="__we-pk-loading" style="padding:18px;">Select a section type from the left</div></div>' +
                      '<div data-pane="library-stage" class="__we-pk-stage" style="display:none;"></div>' +
                      '<div data-pane="custom-stage" class="__we-pk-custom" style="display:none;">' +
                        '<h4>Generate a custom section</h4>' +
                        '<p>Describe the section you want. AI will write it and insert it for you. Uses AI credits.</p>' +
                        '<textarea class="__we-pk-ta" data-custom-input placeholder="e.g. a 3-column logo cloud with customer quotes"></textarea>' +
                        '<button type="button" class="__we-pk-submit" data-custom-submit>Generate section</button>' +
                      '</div>' +
                      '<div data-pane="library-foot" class="__we-pk-foot" style="display:none;"><span class="__we-pk-counter" data-counter>—</span><div style="display:flex;gap:8px;align-items:center;"><span class="__we-pk-loading" data-source-label></span><button type="button" class="__we-pk-insert" data-insert>Insert this section</button></div></div>' +
                    '</div>';
                  bd.appendChild(pk);
                  document.body.appendChild(bd);

                  var typesEl = pk.querySelector('[data-pane="library-types"]');
                  var gridEl = pk.querySelector('[data-pane="library-grid"]');
                  var stageEl = pk.querySelector('[data-pane="library-stage"]');
                  var customStage = pk.querySelector('[data-pane="custom-stage"]');
                  var foot = pk.querySelector('[data-pane="library-foot"]');
                  var counterEl = pk.querySelector('[data-counter]');
                  var sourceLabel = pk.querySelector('[data-source-label]');
                  var titleEl = pk.querySelector('[data-main-title]');
                  var insertBtn = pk.querySelector('[data-insert]');
                  var backBtn = pk.querySelector('[data-back]');

                  var state = { byType: null, currentType: null, variantIndex: 0, mode: 'grid' };
                  var FORCE_VISIBLE_CSS = '<style>html,body{margin:0;font-family:Inter,system-ui,sans-serif;}'
                    + '[data-fade-in],[data-fade-up],[data-fade-down],[data-fade-left],[data-fade-right],[data-reveal],[data-counter],[data-aos],[data-scroll],[data-animate],.fade-in,.fade-up,.fade-down,.fade-left,.fade-right,.reveal,.aos-init,.opacity-0{opacity:1!important;transform:none!important;visibility:visible!important;}'
                    + '*{animation-play-state:running!important;}</style>';
                  function buildSrcDoc(html){ return '<!doctype html><html><head><meta charset="utf-8">' + FORCE_VISIBLE_CSS + '</head><body>' + html + '</body></html>'; }

                  // Lazy thumbnail loader
                  var thumbObserver = null;
                  if (typeof IntersectionObserver !== 'undefined') {
                    thumbObserver = new IntersectionObserver(function(entries){
                      entries.forEach(function(e){
                        if (!e.isIntersecting) return;
                        var ifr = e.target.querySelector('iframe[data-src]');
                        if (ifr) { ifr.srcdoc = ifr.getAttribute('data-src'); ifr.removeAttribute('data-src'); }
                        thumbObserver.unobserve(e.target);
                      });
                    }, { root: gridEl, rootMargin: '300px' });
                  }

                  function renderGrid(){
                    state.mode = 'grid';
                    backBtn.style.display = 'none';
                    var arr = state.byType[state.currentType] || [];
                    gridEl.style.display = 'grid';
                    stageEl.style.display = 'none';
                    foot.style.display = 'none';
                    gridEl.innerHTML = '';
                    if (!arr.length) { gridEl.innerHTML = '<div class="__we-pk-loading" style="padding:18px;">No sections in this category yet.</div>'; return; }
                    arr.forEach(function(sec, idx){
                      var card = document.createElement('div');
                      card.setAttribute('role', 'button');
                      card.setAttribute('tabindex', '0');
                      card.className = '__we-pk-thumb';
                      var label = sec.sourceTemplate.replace(/^ms-/, '').replace(/-/g,' ');
                      var capInner = label + '<small>Variant ' + (idx + 1) + ' of ' + arr.length + '</small>';
                      var thumbInner;
                      if (sec.thumbnailUrl) {
                        // Static screenshot wrapped in fixed-aspect frame.
                        thumbInner = '<div class="__we-pk-thumb-frame"><img class="__we-pk-thumb-img" loading="lazy" alt="" src="' + SECTION_LIBRARY_BASE + sec.thumbnailUrl + '"></div>';
                      } else {
                        // Fallback: live srcdoc iframe scaled down.
                        thumbInner = '<div class="__we-pk-thumb-frame"><iframe sandbox="allow-same-origin" data-src="' + buildSrcDoc(sec.html).replace(/"/g, '&quot;') + '"></iframe></div>';
                      }
                      card.innerHTML = thumbInner + '<div class="__we-pk-thumb-cap">' + capInner + '</div>';
                      card.addEventListener('click', function(){ openExpanded(idx); });
                      gridEl.appendChild(card);
                      if (!sec.thumbnailUrl) {
                        if (thumbObserver) thumbObserver.observe(card); else {
                          var ifr = card.querySelector('iframe[data-src]');
                          if (ifr) { ifr.srcdoc = ifr.getAttribute('data-src'); ifr.removeAttribute('data-src'); }
                        }
                      }
                    });
                  }

                  function openExpanded(idx){
                    state.mode = 'stage';
                    state.variantIndex = idx;
                    backBtn.style.display = 'inline-block';
                    gridEl.style.display = 'none';
                    stageEl.style.display = 'flex';
                    renderStage();
                  }

                  function renderStage(){
                    var arr = state.byType[state.currentType] || [];
                    if (!arr.length) { stageEl.innerHTML = '<div class="__we-pk-loading">No variants found.</div>'; return; }
                    var sec = arr[state.variantIndex];
                    sourceLabel.textContent = sec.sourceTemplate.replace(/^ms-/, '').replace(/-/g,' ');
                    counterEl.textContent = (state.variantIndex+1) + ' of ' + arr.length;
                    stageEl.innerHTML = '';
                    var prevBtn = document.createElement('button');
                    prevBtn.type = 'button';
                    prevBtn.className = '__we-pk-arrow left';
                    prevBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>';
                    var nextBtn = document.createElement('button');
                    nextBtn.type = 'button';
                    nextBtn.className = '__we-pk-arrow right';
                    nextBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>';
                    var ifr = document.createElement('iframe');
                    ifr.setAttribute('sandbox', 'allow-same-origin');
                    ifr.className = '__we-pk-frame';
                    ifr.srcdoc = buildSrcDoc(sec.html);
                    stageEl.appendChild(prevBtn); stageEl.appendChild(ifr); stageEl.appendChild(nextBtn);
                    prevBtn.disabled = state.variantIndex === 0;
                    nextBtn.disabled = state.variantIndex >= arr.length - 1;
                    prevBtn.addEventListener('click', function(){ if(state.variantIndex>0){state.variantIndex--;renderStage();} });
                    nextBtn.addEventListener('click', function(){ if(state.variantIndex<arr.length-1){state.variantIndex++;renderStage();} });
                    foot.style.display = 'flex';
                  }

                  function renderTypes(){
                    var TYPE_ORDER = ['hero','features','showcase','process','team','gallery','video','pricing','testimonials','stats','logos','cta','faq','contact','footer','other'];
                    var TYPE_LABELS = { hero:'Hero', features:'Features', showcase:'Showcase', process:'Process', team:'Team', gallery:'Gallery', video:'Video', pricing:'Pricing', testimonials:'Testimonials', stats:'Stats', logos:'Logos', cta:'Call to action', faq:'FAQ', contact:'Contact', footer:'Footer', other:'Other' };
                    typesEl.innerHTML = '';
                    TYPE_ORDER.forEach(function(t){
                      var arr = state.byType[t] || [];
                      if (!arr.length) return;
                      var btn = document.createElement('button');
                      btn.type = 'button';
                      btn.className = '__we-pk-type' + (t === state.currentType ? ' active' : '');
                      btn.innerHTML = '<span>' + (TYPE_LABELS[t] || t) + '</span><span class="__we-pk-type-count">' + arr.length + '</span>';
                      btn.addEventListener('click', function(){
                        state.currentType = t;
                        titleEl.textContent = (TYPE_LABELS[t] || t) + ' sections';
                        renderTypes();
                        renderGrid();
                      });
                      typesEl.appendChild(btn);
                    });
                  }

                  function bootLibrary(sections){
                    state.byType = {};
                    sections.forEach(function(s){
                      (state.byType[s.type] = state.byType[s.type] || []).push(s);
                    });
                    var first = ['hero','features','pricing','testimonials','cta','footer'].find(function(t){ return state.byType[t] && state.byType[t].length; });
                    state.currentType = first || Object.keys(state.byType)[0] || null;
                    if (state.currentType) titleEl.textContent = state.currentType.charAt(0).toUpperCase() + state.currentType.slice(1) + ' sections';
                    renderTypes();
                    if (state.currentType) renderGrid();
                    else gridEl.innerHTML = '<div class="__we-pk-loading" style="padding:18px;">No sections in library yet.</div>';
                  }

                  ensureLibrary(bootLibrary);

                  backBtn.addEventListener('click', function(){ renderGrid(); });

                  insertBtn.addEventListener('click', function(){
                    var arr = state.byType[state.currentType] || [];
                    var sec = arr[state.variantIndex];
                    if (!sec) return;
                    bd.remove();
                    window.parent.postMessage({
                      type: '__weinc_insert_section_html',
                      data: { html: sec.html, sourceFile: anchor.sourceFile, sourceLine: anchor.sourceLine },
                    }, MSG_ORIGIN);
                  });

                  var tabs = pk.querySelectorAll('[data-tab]');
                  tabs.forEach(function(t){
                    t.addEventListener('click', function(){
                      var w = t.getAttribute('data-tab');
                      tabs.forEach(function(tt){ tt.classList.toggle('active', tt.getAttribute('data-tab') === w); });
                      typesEl.style.display = w === 'library' ? '' : 'none';
                      gridEl.style.display = (w === 'library' && state.mode === 'grid') ? 'grid' : 'none';
                      stageEl.style.display = (w === 'library' && state.mode === 'stage') ? 'flex' : 'none';
                      foot.style.display = (w === 'library' && state.mode === 'stage' && state.currentType) ? 'flex' : 'none';
                      customStage.style.display = w === 'custom' ? 'flex' : 'none';
                      if (w === 'custom') { var ta = pk.querySelector('[data-custom-input]'); if (ta) ta.focus(); }
                    });
                  });

                  pk.querySelector('[data-custom-submit]').addEventListener('click', function(){
                    var ta = pk.querySelector('[data-custom-input]');
                    var desc = (ta && ta.value || '').trim();
                    if (!desc) { ta && ta.focus(); return; }
                    bd.remove();
                    window.parent.postMessage({
                      type: '__weinc_insert_section_custom',
                      data: { description: desc, sourceFile: anchor.sourceFile, sourceLine: anchor.sourceLine },
                    }, MSG_ORIGIN);
                  });

                  pk.querySelector('.__we-pk-close').addEventListener('click', function(){ bd.remove(); });
                  bd.addEventListener('click', function(ev){ if (ev.target === bd) bd.remove(); });
                }


                insTop.querySelector('.__we-ins-btn').addEventListener('click', function(ev){ ev.stopPropagation(); showPicker('before'); });
                insBot.querySelector('.__we-ins-btn').addEventListener('click', function(ev){ ev.stopPropagation(); showPicker('after'); });
              } catch(insErr) { console.error('[WeInc] section-insert init error:', insErr); }
            } catch(err) { console.error('[WeInc] inject_visual_edit error:', err); }
          }
        });
        // Detect white screen (empty root) after initial render and after HMR updates.
        // Runs an initial check at 3s, then monitors for empty root via MutationObserver.
        var whiteScreenReported = false;
        function checkWhiteScreen() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !root.textContent.trim()) {
            if (!whiteScreenReported) {
              whiteScreenReported = true;
              // Carry the cause. "The screen is empty" on its own is a symptom
              // with the evidence thrown away; whatever threw first is the
              // actual bug and it is sitting in causeLog.
              var msg = 'White screen detected: #root is empty — possible render crash';
              if (causeLog.length) {
                msg += '\n\nThis is the symptom. The cause is the error below, which fired '
                  + 'before the screen went blank — fix that, not the blank screen:\n'
                  + causeLog.map(function(c, i){ return '  ' + (i + 1) + '. ' + c; }).join('\n');
              } else {
                // A compile error is evidence too. Vite paints it into its
                // overlay (hidden here) and never throws a JS error, so a
                // syntax error read as "no error captured" and the health
                // check called the report evidence-free (2026-09-11: an
                // unescaped apostrophe in Founders.tsx).
                var viteMsg = '';
                try {
                  var ov = document.querySelector('vite-error-overlay');
                  var sr = ov && ov.shadowRoot;
                  if (sr) {
                    var parts = ['.message-body', '.message', '.file', '.frame'].map(function (sel) {
                      var el = sr.querySelector(sel); return el ? el.textContent.trim() : '';
                    }).filter(Boolean);
                    viteMsg = parts.join('\n').slice(0, 1500);
                  }
                } catch (e) {}
                if (viteMsg) {
                  msg += '\n\nThis is the symptom. The cause is a BUILD (compile) error Vite reported — fix that, not the blank screen:\n' + viteMsg;
                } else {
                  msg += ' (no JavaScript error was captured, so the most likely causes are a '
                    + 'component returning nothing, a failed top-level import, or main.tsx never '
                    + 'calling createRoot().render)';
                }
              }
              report(msg, 'white-screen');
              window.parent.postMessage({ type: '__weinc_white_screen' }, MSG_ORIGIN);
            }
          } else {
            // Root has content. If we previously flagged a blank screen, the
            // app has since mounted (slow first boot, iframe template fetch,
            // HMR remount) — tell the parent to discard the stale white-screen
            // error so the auto-fix loop never rewrites a healthy site.
            if (whiteScreenReported) {
              window.parent.postMessage({ type: '__weinc_white_screen_recovered' }, MSG_ORIGIN);
            }
            whiteScreenReported = false; // Reset so we can detect again after HMR
          }
        }
        setTimeout(checkWhiteScreen, 7000);
        // Also watch for HMR-triggered blank screens (React unmount without remount)
        var rootEl = document.getElementById('root');
        if (rootEl) {
          new MutationObserver(function() {
            // Debounce: check 500ms after DOM settles
            clearTimeout(rootEl.__wcTimer);
            rootEl.__wcTimer = setTimeout(checkWhiteScreen, 500);
          }).observe(rootEl, { childList: true, subtree: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
